spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10           # верхний предел
      minimum-idle: 5                 # простаивающие коннекты
      connection-timeout: 30_000       # ожидание свободного коннекта, мс
      leak-detection-threshold: 10_000 # если коннект используется более 10 с - будет WARN в логах
      idle-timeout: 30_000            # время жизни простаивающих соединений
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public

server:
  port: 8090
