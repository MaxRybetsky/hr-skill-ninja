spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
  jpa:
    # Показать этот параметр
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        ddl-auto: validate
        format_sql: true

server:
  port: 8090
